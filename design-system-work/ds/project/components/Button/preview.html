<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Button — preview</title>
<style>
  body { margin: 16px; font-family: var(--font-body, Arial, Helvetica, sans-serif); color: var(--foreground, #171717); background: var(--background, #ffffff); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 16px; margin: 0 0 16px; }
  .row:last-child { margin-bottom: 0; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .cap { font: 400 12px/16px var(--font-body, Arial, Helvetica, sans-serif); color: var(--gray-500, #6a7282); white-space: nowrap; }
</style>
</head>
<body>
<div class="row">
  <div class="cell"><button class="cp-button cp-button--default">저장</button><span class="cap">default</span></div>
  <div class="cell"><button class="cp-button cp-button--destructive">회원 탈퇴</button><span class="cap">destructive</span></div>
  <div class="cell"><button class="cp-button cp-button--outline">취소</button><span class="cap">outline</span></div>
  <div class="cell"><button class="cp-button cp-button--secondary">이전</button><span class="cap">secondary</span></div>
  <div class="cell"><button class="cp-button cp-button--ghost">로그아웃</button><span class="cap">ghost</span></div>
  <div class="cell"><button class="cp-button cp-button--link">다시 시도</button><span class="cap">link</span></div>
</div>
<div class="row">
  <div class="cell"><button class="cp-button cp-button--default">로그인</button><span class="cap">default · h-10 px-4 py-2</span></div>
  <div class="cell"><button class="cp-button cp-button--default cp-button--sm">회원가입</button><span class="cap">sm · h-9 px-3</span></div>
  <div class="cell"><button class="cp-button cp-button--default cp-button--lg">바로 시작하기<svg class="cp-button__icon cp-button__icon--lg cp-button__icon--after" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg></button><span class="cap">lg · h-11 px-8</span></div>
  <div class="cell"><button class="cp-button cp-button--default cp-button--icon" aria-label="학기 추가"><svg class="cp-button__icon cp-button__icon--lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg></button><span class="cap">icon · h-10 w-10</span></div>
</div>
<div class="row">
  <div class="cell"><button class="cp-button cp-button--default" disabled><svg class="cp-button__spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="cp-button__spinner-track" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" /><path class="cp-button__spinner-head" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" /></svg>로딩중...</button><span class="cap">isLoading</span></div>
  <div class="cell"><button class="cp-button cp-button--default" disabled>저장</button><span class="cap">disabled</span></div>
  <div class="cell"><button class="cp-button cp-button--default is-hover">저장</button><span class="cap">hover</span></div>
  <div class="cell"><button class="cp-button cp-button--default is-active">저장</button><span class="cap">active · scale(0.98)</span></div>
  <div class="cell"><button class="cp-button cp-button--outline is-focus">취소</button><span class="cap">focus-visible</span></div>
  <div class="cell"><button class="cp-button cp-button--default is-focus">저장</button><span class="cap">focus-visible · ring is currentColor (white)</span></div>
</div>
</body>
</html>
