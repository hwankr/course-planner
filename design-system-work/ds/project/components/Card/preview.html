<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Card — preview</title>
<style>
  body { margin: 16px; font: 400 16px/24px var(--font-body, Arial, Helvetica, sans-serif); }
  .stage { background: var(--gray-50, #f9fafb); padding: 16px; display: flex; gap: 24px; align-items: flex-start; }
  .col { flex: 1 1 0; min-width: 0; }
  .label { margin: 8px 0 0; font: 400 12px/16px var(--font-body, Arial, Helvetica, sans-serif); color: var(--gray-500, #6a7282); }
</style>
</head>
<body>
<div class="stage">

  <div class="col">
    <div class="cp-card">
      <div class="cp-card__header">
        <h3 class="cp-card__title">사용자 관리</h3>
        <p class="cp-card__description">사용자 목록과 권한을 관리합니다.</p>
      </div>
      <div class="cp-card__content">
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-default,#101828)">
          <span style="color:var(--gray-600,#4a5565)">계정 유형</span>
          <span style="font-weight:500">이메일 계정</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;margin-top:12px">
          <span style="color:var(--gray-600,#4a5565)">권한</span>
          <span style="font-weight:500;text-transform:capitalize">student</span>
        </div>
      </div>
      <div class="cp-card__footer">
        <span style="color:var(--gray-600,#4a5565)">데이터 저장</span>
        <span style="margin-left:auto;font-weight:500;color:var(--gray-500,#6a7282)">이 브라우저에만 저장</span>
      </div>
    </div>
    <p class="label">default · shadow-sm · bottom row: CardFooter (unused in app)</p>
  </div>

  <div class="col">
    <div class="cp-card is-hover">
      <div class="cp-card__header">
        <h3 class="cp-card__title">사용자 관리</h3>
        <p class="cp-card__description">사용자 목록과 권한을 관리합니다.</p>
      </div>
      <div class="cp-card__content">
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-default,#101828)">
          <span style="color:var(--gray-600,#4a5565)">계정 유형</span>
          <span style="font-weight:500">이메일 계정</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;margin-top:12px">
          <span style="color:var(--gray-600,#4a5565)">권한</span>
          <span style="font-weight:500;text-transform:capitalize">student</span>
        </div>
      </div>
      <div class="cp-card__footer">
        <span style="color:var(--gray-600,#4a5565)">데이터 저장</span>
        <span style="margin-left:auto;font-weight:500;color:var(--gray-500,#6a7282)">이 브라우저에만 저장</span>
      </div>
    </div>
    <p class="label">hover (.is-hover) · shadow-md · bottom row: CardFooter (unused in app)</p>
  </div>

</div>
</body>
</html>
